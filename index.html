<script>
/* Theme before first paint, or the page flashes Plaster on its way to Evening.
   Stored choice wins; otherwise follow the system. Language is NOT auto-detected — see claude.md. */
(function () {
  /* The service list and gallery are rendered by JS, so when the browser restores a
     scroll offset on reload the document is still a stub and far shorter than it ends
     up. The restored offset gets clamped to that stub's bottom, the lists then render
     underneath, and the visitor starts at the footer with every reveal already spent.
     Own the scroll position instead of letting the browser guess at it. */
  if ('scrollRestoration' in history) history.scrollRestoration = 'manual';

  var stored = localStorage.getItem('hgs-theme');
  var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  if (dark) document.documentElement.dataset.theme = 'dark';
})();
</script>

<main id="main">

      <div class="hero-cta">
        <a class="btn btn-filled" href="#booking" data-i18n="hero.cta"></a>
        <a class="btn btn-outline" href="#services" data-i18n="hero.cta2"></a>
      </div>
    </div>
  </section>

  <section class="section" id="services">

  <section class="section bridal" id="bridal">

  <section class="section" id="gallery">

      <h2 class="section-title" data-i18n="gallery.title"></h2>
      <p class="section-sub" data-i18n="gallery.sub"></p>
      <ul class="gallery-grid" id="gallery-grid"></ul>
    </div>
  </section>

  <section class="section booking" id="booking">
    <div class="wrap wrap-narrow">
      <h2 class="section-title" data-i18n="booking.title"></h2>
      <p class="section-sub" data-i18n="booking.sub"></p>

      <form class="booking-form" id="booking-form">
        <p class="field">
          <label for="f-name" data-i18n="booking.name"></label>
          <input id="f-name" name="name" type="text" required autocomplete="name" data-i18n-attr="placeholder:booking.namePh">
        </p>
        <p class="field">
          <label for="f-phone" data-i18n="booking.phone"></label>
          <input id="f-phone" name="phone" type="tel" required autocomplete="tel" inputmode="tel" data-i18n-attr="placeholder:booking.phonePh">
        </p>
        <p class="field">
          <label for="f-service" data-i18n="booking.service"></label>
          <select id="f-service" name="service" required></select>
        </p>
        <div class="field-row">
          <p class="field">
            <label for="f-date" data-i18n="booking.date"></label>
            <input id="f-date" name="date" type="date" required>
          </p>
          <p class="field">
            <label for="f-time" data-i18n="booking.time"></label>
            <input id="f-time" name="time" type="time" required min="08:00" max="20:00" step="900">
          </p>
        </div>
        <button class="btn btn-filled btn-block" type="submit" data-i18n="booking.submit"></button>
        <p class="form-note" data-i18n="booking.note"></p>
      </form>
    </div>
  </section>
